# Dedicated DIKU Ubuntu VPS: affects ALL logs in the default host journal.
# This is not a promise about unrelated file logs or external provider logs.
[Journal]
Storage=persistent
MaxRetentionSec=30day
MaxFileSec=1day
SystemMaxUse=256M
RuntimeMaxUse=64M
# Avoid a second indefinitely retained copy via traditional syslog forwarding.
# A separately configured imjournal reader must still be checked on the host.
ForwardToSyslog=no
