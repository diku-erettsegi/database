name: diku-local
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME:-diku}
      MARIADB_USER: ${DB_USER:-diku}
      MARIADB_PASSWORD: ${DB_PASSWORD:-diku_local_password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-diku_local_root_password}
      TZ: Europe/Budapest
    ports:
      - "127.0.0.1:${DB_PORT:-3308}:3306"
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  backend:
    image: diku-backend:local
    build:
      context: ../backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/${DB_NAME:-diku}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-diku}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-diku_local_password}
      SPRING_PROFILES_ACTIVE: local
      STORAGE_PATH: /app/uploads
      SECURE_COOKIE: "false"
      TZ: Europe/Budapest
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/actuator/health]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped
  frontend:
    image: diku-frontend:local
    build:
      context: ../frontend
      args:
        VITE_APPLICATIONS_ENABLED: "true"
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  database:
  uploads:
